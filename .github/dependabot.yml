version: 2
updates:
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /load-generator
    schedule:
      interval: weekly
    groups:
      playwright:
        patterns:
          - "playwright*"
          - "@playwright/*"

  - package-ecosystem: docker
    directory: /load-generator
    schedule:
      interval: weekly

  # Try to disable workspace security checks and update because these are
  # for test purposes only, and we want keep the old versions mostly untouched.
  - package-ecosystem: npm
    directory: /workspaces
    schedule:
      interval: yearly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

