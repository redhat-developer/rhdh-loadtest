# RHDH 2.x chart values (oci://quay.io/rhdh/chart)
# Subchart is aliased as redhat-developer-hub in Chart.yaml
redhat-developer-hub:
  openshift:
    # Override at install time, e.g.:
    #   CLUSTER_ROUTER_BASE=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}')
    #   make install CLUSTER_ROUTER_BASE=$$CLUSTER_ROUTER_BASE
    clusterRouterBase: apps.example.com
    route:
      enabled: true

  catalogIndex:
    image:
      registry: quay.io
      repository: rhdh/plugin-catalog-index
      tag: "2.1"

  # Disable Lightspeed / Intelligent Assistant for load tests
  intelligentAssistant:
    enabled: false

  dynamicPlugins:
    plugins:
      - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
        disabled: false
      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-bulk-import
        disabled: true
      - package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-bulk-import-backend-dynamic
        disabled: true
